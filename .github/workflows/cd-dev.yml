name: CD dev

# Deploy-on-green to the Render dev service (issue #47).
#
# Trigger safety (issue #47 AC1): `workflow_run` fires only when the `CI`
# workflow (exact `name:` of .github/workflows/ci.yml) completes on `main`
# (branches filter). PR runs can never trigger this workflow. A
# failed/cancelled CI run never deploys: the gate on the first job checks
# `workflow_run.conclusion == 'success'`. `workflow_dispatch` exists only as
# the manual QA/verification vehicle.
#
# Concurrency relay (issue #14 reviewer finding, resolved here): CI's group is
# `ci-${{ github.ref }}` with cancel-in-progress: true and contains only CI
# runs. This workflow runs in the DISJOINT group `cd-dev-main` with
# cancel-in-progress: false (the literal line below is deliberate — do not
# omit it), so a new CI run can never cancel an in-flight deploy, and
# back-to-back merges queue CD runs instead of killing the running one
# (GitHub's concurrency queue holds max 1 pending run; if more queue up the
# surplus is dropped — acceptable for dev, the next push re-triggers).
# Therefore .github/workflows/ci.yml needs NO split — zero lines change there.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lucapug/clown-circus-reloaded
  RENDER_API_BASE: https://api.render.com/v1
  DEV_HEALTH_URL: ${{ vars.DEV_HEALTH_URL || 'https://clown-circus-reloaded.onrender.com/health' }}
  # The commit CD deploys is the CI-green head of the triggering run — NOT
  # GITHUB_SHA, which under `workflow_run` is the default-branch HEAD and can
  # drift past the tested commit if more pushes land while the deploy runs.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Tag construction: deterministic from UTC clock + the CI-green commit
  # (workflow-level DEPLOY_SHA — see env block; never GITHUB_SHA here).
  # Carries the workflow-level gate so a failed CI run skips everything.
  meta:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.tags.outputs.shortsha }}
      immutable: ${{ steps.tags.outputs.immutable }}
      mainonly: ${{ steps.tags.outputs.mainonly }}
    steps:
      - id: tags
        run: |
          SHORTSHA="${DEPLOY_SHA::7}"
          IMMUTABLE="$(date -u +%Y%m%d-%H%M%S)-${SHORTSHA}"   # e.g. 20261022-141503-1a2b3c4
          {
            echo "shortsha=$SHORTSHA"
            echo "immutable=$IMMUTABLE"
            echo "mainonly=$([[ $GITHUB_REF == refs/heads/main ]] && echo yes || echo no)"
          } >> "$GITHUB_OUTPUT"

  # Build ONCE, push immutable (+ moving main) tag. `packages: write` is
  # scoped to THIS job only; deploy-dev gets no packages permission.
  push-ghcr:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the CI-green commit, not the drifted default-branch tip.
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_OUTPUT multiline protocol (issue #50): bare lines abort the
      # step with `Invalid format`; the `key<<EOF ... EOF` heredoc form
      # yields ONE output `tags` whose value is the newline-joined list that
      # docker/build-push-action consumes below.
      - id: tags
        name: Build tag list (moving main tag only on main)
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}"
            if [[ "${{ needs.meta.outputs.mainonly }}" == "yes" ]]; then
              echo "${IMAGE_NAME}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Single build+push of both tags; the deploy job reuses this tag and
      # never rebuilds.
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Record image in job summary
        run: |
          {
            echo "### GHCR push"
            echo ""
            echo "Image: ${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}"
            echo "Digest: ${{ steps.push.outputs.digest }}"
            echo "Moving tag \`main\`: ${{ needs.meta.outputs.mainonly == 'yes' && 'pushed' || 'skipped (not main)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy the exact pushed image to the Render dev service and validate
  # health. Degrades to a green no-op with a loud notice while
  # RENDER_API_KEY (secret) / RENDER_DEV_SERVICE_ID (repo variable) are unset.
  #
  # Call ordering (issue #52): fetch owner → PATCH image → PUT env-vars →
  # POST deploy → poll `live` → /health. Render SERIALIZES deploys per
  # service: the PATCH and the env-vars PUT can each enqueue an auto-deploy,
  # but a later explicit POST /deploys SUPERSEDES those intermediate
  # auto-deploys (Render cancels them as superseded). Only the final explicit
  # deploy — which then carries BOTH the new image and the new environment —
  # must reach `live`, so every mutation happens strictly BEFORE the POST.
  #
  # Error visibility (issue #52): every call goes through the per-step `api`
  # helper — `curl -sS -w '\nHTTP_STATUS:%{http_code}'` into a variable,
  # status printed, and any non-2xx fails the step WITH Render's response
  # body in the log. Never `curl -f` with swallowed output. (Render error
  # responses are {"message": …} diagnostics; on the success path only KEY
  # NAMES of env vars are printed, never values.)
  deploy-dev:
    needs: [meta, push-ghcr]
    runs-on: ubuntu-latest
    steps:
      # GitHub's `secrets` context is unavailable in job-level `if:`, so the
      # configured/not-configured decision is made here at step level.
      - id: cfg
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
        run: |
          if [[ -n "$RENDER_API_KEY" && -n "$RENDER_DEV_SERVICE_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record image info in job summary
        run: |
          {
            echo "### CD dev deploy"
            echo ""
            echo "Image: ${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}"
            echo "Digest: ${{ needs.push-ghcr.outputs.digest }}"
            echo "service.version=${{ needs.meta.outputs.shortsha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CD not configured — skip deploy, stay green
        if: steps.cfg.outputs.configured != 'true'
        run: |
          echo "::notice::CD not configured — set RENDER_API_KEY and RENDER_DEV_SERVICE_ID"
          {
            echo "### CD not configured — set RENDER_API_KEY and RENDER_DEV_SERVICE_ID"
            echo ""
            echo "(GHCR push above still ran; deploy skipped, job stays green)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The `api` helper (identical lines in every configured step below):
      # status capture via -w, body always in reach, non-2xx -> loud fail with
      # the body printed. Diagnostics go to stderr so a caller that discards
      # stdout (patch/put whose response it does not need) still shows them.
      - name: Fetch workspace ownerId (GET /owners)
        id: owner
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          api() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -w '\nHTTP_STATUS:%{http_code}' -X "$method" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
            if [[ -n "$body" ]]; then args+=(-d "$body"); fi
            local resp status payload
            if ! resp="$(curl "${args[@]}" "${RENDER_API_BASE}${path}")"; then
              echo "::error::curl transport failure on $method $path" >&2; exit 1
            fi
            status="${resp##*$'\n'}"; status="${status#HTTP_STATUS:}"
            payload="${resp%$'\n'*}"
            echo "render $method $path -> HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Render API $method $path failed (HTTP $status) — response body follows:" >&2
              printf '%s\n' "$payload" >&2
              exit 1
            fi
            printf '%s\n' "$payload"
          }
          OWNERS_JSON="$(api GET /owners)"
          N="$(echo "$OWNERS_JSON" | jq 'length')"
          if [[ "$N" -ne 1 ]]; then
            echo "::error::expected exactly 1 owner (one-workspace account), got $N:" >&2
            echo "$OWNERS_JSON" | jq -r '.[] | "  \(.id) — \(.name // .email // "?")"' >&2
            exit 1
          fi
          OWNER_ID="$(echo "$OWNERS_JSON" | jq -r '.[0].id')"
          echo "owner_id=$OWNER_ID" >> "$GITHUB_OUTPUT"

      # servicePATCH (api-docs.render.com, issue #52): `image` REQUIRES both
      # `ownerId` and `imagePath`, and NOTHING else goes in this call —
      # `envVars` is not an accepted servicePATCH field at all.
      - name: PATCH service image (ownerId + imagePath only)
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
          OWNER_ID: ${{ steps.owner.outputs.owner_id }}
        run: |
          api() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -w '\nHTTP_STATUS:%{http_code}' -X "$method" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
            if [[ -n "$body" ]]; then args+=(-d "$body"); fi
            local resp status payload
            if ! resp="$(curl "${args[@]}" "${RENDER_API_BASE}${path}")"; then
              echo "::error::curl transport failure on $method $path" >&2; exit 1
            fi
            status="${resp##*$'\n'}"; status="${status#HTTP_STATUS:}"
            payload="${resp%$'\n'*}"
            echo "render $method $path -> HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Render API $method $path failed (HTTP $status) — response body follows:" >&2
              printf '%s\n' "$payload" >&2
              exit 1
            fi
            printf '%s\n' "$payload"
          }
          BODY="$(jq -n --arg owner "$OWNER_ID" \
            --arg img "${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}" \
            '{image: {ownerId: $owner, imagePath: $img}}')"
          api PATCH "/services/$RENDER_DEV_SERVICE_ID" "$BODY" > /dev/null

      # service.version per deploy (issue #52): `envVars` is NOT a servicePATCH
      # field — env vars are managed by the bulk endpoint. GET the full list
      # (cursor-paginated; items are {"cursor":…,"envVar":{key,value}}),
      # jq-update ONLY OTEL_RESOURCE_ATTRIBUTES (add if absent) — every other
      # key/value, DATABASE_URL above all, passes through byte-for-byte —
      # then PUT the complete list back (bulk replace).
      - name: Update OTEL_RESOURCE_ATTRIBUTES via env-vars endpoint
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
        run: |
          api() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -w '\nHTTP_STATUS:%{http_code}' -X "$method" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
            if [[ -n "$body" ]]; then args+=(-d "$body"); fi
            local resp status payload
            if ! resp="$(curl "${args[@]}" "${RENDER_API_BASE}${path}")"; then
              echo "::error::curl transport failure on $method $path" >&2; exit 1
            fi
            status="${resp##*$'\n'}"; status="${status#HTTP_STATUS:}"
            payload="${resp%$'\n'*}"
            echo "render $method $path -> HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Render API $method $path failed (HTTP $status) — response body follows:" >&2
              printf '%s\n' "$payload" >&2
              exit 1
            fi
            printf '%s\n' "$payload"
          }
          CURSOR=""
          : > "$RUNNER_TEMP/env-vars.jsonl"
          while :; do
            EP="/services/$RENDER_DEV_SERVICE_ID/env-vars?limit=100"
            if [[ -n "$CURSOR" ]]; then
              EP="${EP}&cursor=$(jq -rn --arg c "$CURSOR" '$c|@uri')"
            fi
            PAGE="$(api GET "$EP")"
            echo "$PAGE" | jq -c '.[].envVar' >> "$RUNNER_TEMP/env-vars.jsonl"
            CURSOR="$(echo "$PAGE" | jq -r '.[-1].cursor // empty')"
            if [[ -z "$CURSOR" ]]; then break; fi
          done
          CURRENT="$(jq -s '.' "$RUNNER_TEMP/env-vars.jsonl")"   # one flat [{key,value}, ...]
          echo "fetched env var keys: $(echo "$CURRENT" | jq -r 'map(.key) | join(", ")')"
          NEW_OTEL="deployment.environment.name=dev,service.version=${{ needs.meta.outputs.shortsha }}"
          UPDATED="$(echo "$CURRENT" | jq --arg k OTEL_RESOURCE_ATTRIBUTES --arg v "$NEW_OTEL" '
            if any(.[]; .key == $k)
            then map(if .key == $k then .value = $v else . end)
            else . + [{"key": $k, "value": $v}] end')"
          # Post-conditions on the PUT body: DATABASE_URL still present and
          # OTEL carries the new value. Key names only in the log — values
          # (DATABASE_URL) are never printed.
          if ! echo "$UPDATED" | jq -e --arg v "$NEW_OTEL" '
            (any(.[]; .key == "DATABASE_URL")) and
            (any(.[]; .key == "OTEL_RESOURCE_ATTRIBUTES" and .value == $v))' > /dev/null; then
            echo "::error::env-vars PUT body failed post-conditions (DATABASE_URL present + new OTEL value)" >&2
            echo "keys in PUT body: $(echo "$UPDATED" | jq -r 'map(.key) | join(", ")')" >&2
            exit 1
          fi
          api PUT "/services/$RENDER_DEV_SERVICE_ID/env-vars" "$UPDATED" > /dev/null
          echo "env-vars updated: OTEL_RESOURCE_ATTRIBUTES=$NEW_OTEL (all other keys preserved)"

      - name: POST deploy of the immutable image
        id: deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
        run: |
          api() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -w '\nHTTP_STATUS:%{http_code}' -X "$method" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
            if [[ -n "$body" ]]; then args+=(-d "$body"); fi
            local resp status payload
            if ! resp="$(curl "${args[@]}" "${RENDER_API_BASE}${path}")"; then
              echo "::error::curl transport failure on $method $path" >&2; exit 1
            fi
            status="${resp##*$'\n'}"; status="${status#HTTP_STATUS:}"
            payload="${resp%$'\n'*}"
            echo "render $method $path -> HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Render API $method $path failed (HTTP $status) — response body follows:" >&2
              printf '%s\n' "$payload" >&2
              exit 1
            fi
            printf '%s\n' "$payload"
          }
          BODY="$(jq -n --arg img "${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}" '{imageUrl:$img}')"
          RESP="$(api POST "/services/$RENDER_DEV_SERVICE_ID/deploys" "$BODY")"
          DEPLOY_ID="$(echo "$RESP" | jq -r '.id')"
          if [[ -z "$DEPLOY_ID" || "$DEPLOY_ID" == "null" ]]; then
            echo "::error::POST deploy returned no deploy id" >&2; exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      # Bounded poll: 30 attempts x 20 s = 10 min cap. Timeout is RED.
      # Transient API errors (429/5xx/transport) fail the ATTEMPT, not the
      # step: the helper's status+body output is captured and shown per
      # attempt, a successful call resets the counter, and only 3
      # CONSECUTIVE failures give up RED with the last body. Terminal deploy
      # statuses and the cap are unaffected.
      - name: Poll deploy status until live
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          api() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -w '\nHTTP_STATUS:%{http_code}' -X "$method" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
            if [[ -n "$body" ]]; then args+=(-d "$body"); fi
            local resp status payload
            if ! resp="$(curl "${args[@]}" "${RENDER_API_BASE}${path}")"; then
              echo "::error::curl transport failure on $method $path" >&2; exit 1
            fi
            status="${resp##*$'\n'}"; status="${status#HTTP_STATUS:}"
            payload="${resp%$'\n'*}"
            echo "render $method $path -> HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Render API $method $path failed (HTTP $status) — response body follows:" >&2
              printf '%s\n' "$payload" >&2
              exit 1
            fi
            printf '%s\n' "$payload"
          }
          CONSECUTIVE=0
          API_ERR="$RUNNER_TEMP/poll-api.err"
          for i in $(seq 1 30); do
            if RESP="$(api GET "/services/$RENDER_DEV_SERVICE_ID/deploys/$DEPLOY_ID" 2>"$API_ERR")"; then
              CONSECUTIVE=0
              STATUS="$(echo "$RESP" | jq -r '.status')"
              echo "poll $i/30: ${STATUS:-<no status>}"
              case "$STATUS" in
                live) echo "deploy is live"; exit 0 ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::deploy ended with status: $STATUS"; exit 1 ;;
              esac
            else
              CONSECUTIVE=$((CONSECUTIVE + 1))
              echo "poll $i/30: API call failed (consecutive $CONSECUTIVE/3) — helper output:"
              cat "$API_ERR"
              if [[ "$CONSECUTIVE" -ge 3 ]]; then
                echo "::error::deploy poll gave up after 3 consecutive API failures — last response:"
                cat "$API_ERR"
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::deploy poll timed out (10 min cap)"; exit 1

      # Health validation: HTTP 200 AND the EXACT body {"status":"ok"}
      # (exact-byte assert, no jq). 30 x 20 s absorbs the ~1 min free-tier
      # cold start. Status + body are captured per attempt (no -f); on giving
      # up the LAST observed status/body is printed before the step goes red.
      - name: Health validation
        if: steps.cfg.outputs.configured == 'true'
        run: |
          LAST=""
          for i in $(seq 1 30); do
            RESP="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' --max-time 10 "$DEV_HEALTH_URL" 2>/dev/null || true)"
            STATUS="${RESP##*$'\n'}"; STATUS="${STATUS#HTTP_STATUS:}"
            BODY="${RESP%$'\n'*}"
            if [[ "$STATUS" == "200" && "$BODY" == '{"status":"ok"}' ]]; then
              echo "health ok (attempt $i)"; exit 0
            fi
            LAST="HTTP ${STATUS:-<transport failure>} body: $BODY"
            sleep 20
          done
          echo "::error::health validation failed — last observed: $LAST"; exit 1

      - name: Final summary
        if: steps.cfg.outputs.configured == 'true'
        env:
          RENDER_DEV_SERVICE_ID: ${{ vars.RENDER_DEV_SERVICE_ID }}
        run: |
          {
            echo "### Deployed to dev"
            echo ""
            echo "- Image: ${IMAGE_NAME}:${{ needs.meta.outputs.immutable }}"
            echo "- Digest: ${{ needs.push-ghcr.outputs.digest }}"
            echo "- service.version=${{ needs.meta.outputs.shortsha }}"
            echo "- Deploy: https://dashboard.render.com/web/$RENDER_DEV_SERVICE_ID"
          } >> "$GITHUB_STEP_SUMMARY"
